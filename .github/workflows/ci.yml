name: ci

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/med23b/demo-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
      - run: echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  promote:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Open PR on the platform repo
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
          IMAGE: ghcr.io/med23b/demo-app
          DIGEST: ${{ needs.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Med23B/Cloud-Operations-Platform.git" platform
          cd platform
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          BRANCH="bump-demo-app-${SHA::7}"
          git checkout -b "$BRANCH"
          sed -i -E "s#(image: ${IMAGE}@)sha256:[0-9a-f]{64}#\1${DIGEST}#" apps/demo-app/demo-app.yaml
          git commit -am "demo-app: deploy ${SHA::7}"
          git push origin "$BRANCH"
          gh pr create --repo Med23B/Cloud-Operations-Platform --base main --head "$BRANCH" \
            --title "demo-app: deploy ${SHA::7}" \
            --body "Image ${IMAGE}@${DIGEST} built from commit ${SHA}"
